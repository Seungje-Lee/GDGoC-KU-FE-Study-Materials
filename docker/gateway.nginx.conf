# ==================================================================
# gateway.nginx.conf — Next.js 앞단의 nginx (4회차 §10)
# ==================================================================
# 3회차의 nginx 는 "파일을 주는 역할"이었습니다.
# 여기서 nginx 는 파일을 주지 않습니다. 뒤에 있는 Node 프로세스로 넘기는
# 문지기(gateway) 역할만 합니다 — HTTPS 종료·압축·캐시 헤더·정적 자산 처리,
# 그리고 Node 프로세스를 바깥에 직접 노출하지 않기.
# ==================================================================

upstream next_app {
    # 'next' 는 docker-compose.yml 의 서비스 이름입니다.
    server next:3000;
}

server {
    listen 80;
    server_name _;

    # Next.js 가 만든 정적 자산은 파일명에 해시가 붙어 있으므로 영구 캐시 가능
    # (3회차 /assets/ 캐시 헤더와 똑같은 논리입니다)
    location /_next/static/ {
        proxy_pass http://next_app;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://next_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
