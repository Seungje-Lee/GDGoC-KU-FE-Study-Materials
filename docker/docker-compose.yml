services:
  web:
    build:
      context: ../week4-start
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: study-web
    ports:
      - "8080:80"
    depends_on:
      mini-api:
        condition: service_healthy
    restart: unless-stopped

  mini-api:
    build:
      context: ../mini-api
      dockerfile: Dockerfile
    container_name: study-mini-api
    # ports 를 일부러 적지 않았습니다 (아래 설명)
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3001/api/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
